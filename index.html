<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1c1e">
<link rel="manifest" href="manifest.json">
<title>栄ガーデン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;
  font-family:'Noto Sans JP','Inter',sans-serif;
  background:#e8e0d0;
  color:#1c1c1e;
  overflow-x:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ── ヘッダー ── */
.header{
  background:#1c1c1e;
  color:#fff;
  text-align:center;
  padding:44px 16px 20px;
  position:relative;
}
.header::after{
  content:'';position:absolute;bottom:0;left:10%;right:10%;
  height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
}

/* ロゴ行 */
.logo-row{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-bottom:20px;
}
.logo-svg{
  width:56px;height:56px;flex-shrink:0;
  object-fit:contain;
  filter:drop-shadow(0 0 8px rgba(46,204,113,.3));
}
.logo-name{
  font-family:'Noto Sans JP',sans-serif;
  font-size:32px;font-weight:900;
  color:#2ecc71;
  letter-spacing:2px;
  text-shadow:0 0 20px rgba(46,204,113,.25);
  line-height:1;
}

/* 時計 */
.clock-area{margin-top:4px}
.clock-date{
  font-family:'Inter','Noto Sans JP',sans-serif;
  font-size:16px;font-weight:600;
  color:rgba(255,255,255,.7);
  letter-spacing:1px;
  margin-bottom:4px;
}
.clock-divider{
  width:40px;height:1px;margin:6px auto;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
}
.clock-time{
  font-family:'Inter',sans-serif;
  font-size:36px;font-weight:700;
  color:#fff;
  letter-spacing:4px;
  line-height:1;
}

/* ── グリッド（2×2） ── */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  max-width:440px;
  margin:0 auto;
  padding:28px 20px 40px;
}

/* ── アプリカード（案3：カード全体に色） ── */
.app{
  text-decoration:none;
  position:relative;overflow:hidden;
  border-radius:18px;
  color:#fff;
  padding:22px 14px 20px;
  text-align:center;
  transition:transform .18s,box-shadow .25s,filter .2s;
  aspect-ratio:1/1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.18);
}
.app::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.08) 60%,rgba(0,0,0,.18));
}
.app:hover,.app:focus{
  transform:translateY(-3px);
  box-shadow:0 8px 22px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.22);
  filter:saturate(1.05);
}
.app:active{transform:scale(.96)}

/* 4色テーマ：カード全体（深め＆鮮やか）。文字・アイコンは白でコントラスト確保。 */
.app[data-color="green"] {background:linear-gradient(160deg,#22a35a,#16783f)}
.app[data-color="orange"]{background:linear-gradient(160deg,#f47c14,#d65a0a)}
.app[data-color="blue"]  {background:linear-gradient(160deg,#2e74d8,#1a52a3)}
.app[data-color="purple"]{background:linear-gradient(160deg,#9b34c7,#6d22a0)}

/* アイコン（Tabler webfont） */
.app .icon{
  position:relative;z-index:1;
  font-size:46px;line-height:1;
  color:#fff;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));
}
.app .name{
  position:relative;z-index:1;
  font-size:16px;font-weight:700;
  line-height:1.2;
  color:#fff;
  letter-spacing:.06em;
  text-shadow:0 1px 2px rgba(0,0,0,.2);
}

/* リップル */
.ripple{
  position:absolute;border-radius:50%;
  background:rgba(0,0,0,.1);
  transform:scale(0);animation:ripple-anim .5s ease-out;
  pointer-events:none;
}
@keyframes ripple-anim{to{transform:scale(3);opacity:0}}

/* 準備中オーバーレイ */
.app.wip{filter:grayscale(.6) brightness(.85)}
.app.wip .overlay{
  position:absolute;inset:0;border-radius:inherit;
  background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;z-index:2;
}
.app.wip .overlay span{
  font-size:11px;font-weight:700;
  background:#fff;color:#1c1c1e;
  padding:4px 12px;border-radius:20px;
  letter-spacing:1px;
}

/* トースト */
.toast{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;justify-content:center;
  padding:0 20px 28px;
  pointer-events:none;z-index:200;
}
.toast-inner{
  background:#1c1c1e;
  color:#fff;padding:12px 24px;border-radius:12px;
  font-size:14px;font-weight:500;
  box-shadow:0 4px 16px rgba(0,0,0,.2);
  transform:translateY(80px);opacity:0;
  transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s;
}
.toast-inner.show{transform:translateY(0);opacity:1}

/* フッター */
.footer{
  text-align:center;padding:0 20px 24px;
  font-size:11px;color:rgba(0,0,0,.25);
  font-family:'Inter',sans-serif;letter-spacing:.5px;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo-row">
    <img class="logo-svg" src="logo.png" alt="栄ガーデン ロゴ">
    <span class="logo-name">栄ガーデン</span>
  </div>
  <div class="clock-area">
    <div class="clock-date" id="clock-date"></div>
    <div class="clock-divider"></div>
    <div class="clock-time" id="clock-time"></div>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="footer">&copy; 2026 SAKAE GARDEN</div>

<div class="toast"><div class="toast-inner" id="toast"></div></div>

<script>
// 表示するアプリ（2×2 配置・色被りなし・Tablerアイコン）
// 左上→右上→左下→右下 の順
const APPS = [
  { icon:'ti-clipboard-list',  name:'日報',     url:'https://sakae-garden.github.io/nippo/',              color:'green'  },
  { icon:'ti-building-store',  name:'卸販売',   url:'https://sakae-garden.github.io/oroshi.html',         color:'orange' },
  { icon:'ti-chart-bar',       name:'サマリー', url:'https://sakae-garden.github.io/nippo/summary.html',  color:'blue'   },
  { icon:'ti-package',         name:'配達商品', url:'https://sakae-garden.github.io/nippo/haitatsu.html', color:'purple' },
];
// 非表示中（必要になったら APPS に戻す。URLで直接アクセス可）
// 資金繰りはランチャー非掲載。URL直アクセスのみ（従業員の目に触れさせない運用）。
// パスコード認証は不要と決定（URL秘匿を実質のアクセス制御とする）。
// { icon:'ti-report-money',   name:'資金繰り',     url:'https://sakae-garden.github.io/shikinguri.html',         color:'green'  },
// { icon:'ti-truck-delivery', name:'出荷情報',     url:'https://sakae-garden.github.io/shipping.html',           color:'green'  },
// { icon:'ti-shopping-bag',   name:'袋詰め指示',   url:'https://sakae-garden.github.io/fukurozume.html',         color:'orange' },
// { icon:'ti-eye-check',      name:'袋詰め確認',   url:'https://sakae-garden.github.io/fukurozume-kakunin.html', color:'blue'   },
// { icon:'ti-plant',          name:'日次作業入力', url:'https://sakae-garden.github.io/harvest/employee.html',   color:'purple', wip:true },
// { icon:'ti-trending-up',    name:'収穫予測',     url:'https://sakae-garden.github.io/harvest/owner.html',      color:'green',  wip:true },

const grid = document.getElementById('grid');
APPS.forEach(app => {
  const a = document.createElement('a');
  a.href = app.wip ? '#' : app.url;
  a.className = 'app' + (app.wip ? ' wip' : '');
  a.dataset.color = app.color;
  a.innerHTML =
    `<i class="icon ti ${app.icon}" aria-hidden="true"></i>` +
    `<span class="name">${app.name}</span>` +
    (app.wip ? '<div class="overlay"><span>準備中</span></div>' : '');

  a.addEventListener('click', function(e) {
    const rect = a.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height) * 2;
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size/2) + 'px';
    r.style.top = (e.clientY - rect.top - size/2) + 'px';
    a.appendChild(r);
    setTimeout(() => r.remove(), 500);
    if (app.wip) {
      e.preventDefault();
      showToast('このアプリは現在準備中です');
    }
  });
  grid.appendChild(a);
});

function updateClock() {
  const now = new Date();
  const y = now.getFullYear();
  const mo = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  const wd = ['日','月','火','水','木','金','土'][now.getDay()];
  const h = String(now.getHours()).padStart(2,'0');
  const mi = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock-date').textContent = `${y}.${mo}.${d} (${wd})`;
  document.getElementById('clock-time').textContent = `${h}:${mi}`;
}
updateClock();
setInterval(updateClock, 10000);

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
