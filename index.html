<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f1ea">
<link rel="manifest" href="manifest.json">
<title>栄ガーデン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;600&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
<style>
/* 【2026-11-10 杉さん承認 23:53】ホームのデザイン刷新（案B ライト）。配達／ハウス作業は左右のスワイプで切り替え。
   旧 /kanri.html は /index.html#house へ転送。PORTAL_BUILD = 'portal-light-swipe-20261110' */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Noto Sans JP','Inter',sans-serif;
  background:#f4f1ea;color:#1c1c1e;
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;
  overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.hd{padding:calc(env(safe-area-inset-top,0px) + 26px) 24px 4px;display:flex;justify-content:space-between;align-items:center}
.br{display:flex;align-items:center;gap:9px}
.br img{width:30px;height:38px;object-fit:contain}
.br b{font-size:17px;letter-spacing:.1em;font-weight:900;color:#1e7a48}
.dt{font-size:12.5px;color:#6c6c70;font-weight:500;letter-spacing:.04em}
.big{padding:6px 24px 0;font-family:'Inter',sans-serif;font-size:54px;font-weight:200;letter-spacing:.01em;line-height:1.05;font-variant-numeric:tabular-nums}
.seg{margin:18px 24px 0;display:flex;gap:22px;border-bottom:1px solid #e0dacd}
.seg button{appearance:none;background:none;border:none;font-family:inherit;padding:8px 2px 10px;font-size:15px;font-weight:700;color:#a8a294;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.seg button.on{color:#1c1c1e;border-bottom-color:#1e7a48}
.pages{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px}
.app{
  text-decoration:none;color:#1c1c1e;position:relative;
  background:#fff;border-radius:18px;padding:16px 12px;
  display:flex;align-items:center;gap:10px;min-width:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 16px rgba(80,60,20,.08);
  transition:transform .08s;
}
.app:active{transform:scale(.97)}
.app .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.app .ic i{font-size:26px;color:#fff;line-height:1}
.app .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ic[data-c="green"] {background:linear-gradient(150deg,#34c77b,#128a4a)}
.ic[data-c="orange"]{background:linear-gradient(150deg,#ffa040,#e0640c)}
.ic[data-c="blue"]  {background:linear-gradient(150deg,#4f9bff,#1f5fd0)}
.ic[data-c="purple"]{background:linear-gradient(150deg,#b56bf0,#7a2fc4)}
.ic[data-c="teal"]  {background:linear-gradient(150deg,#2fd0bd,#0b8a7a)}
.app.wip .ic{filter:grayscale(1);opacity:.45}
.app.wip .nm{color:#a8a294}
.app.wip::after{content:'準備中';position:absolute;top:8px;right:10px;font-size:9.5px;font-weight:700;color:#a8a294;letter-spacing:.05em}
.dots{display:flex;gap:7px;justify-content:center;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 22px)}
.dots i{width:7px;height:7px;border-radius:50%;background:#d4cdbd;display:block}
.dots i.on{background:#1c1c1e}
.toast{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 20px 56px;pointer-events:none;z-index:200}
.toast-inner{background:#1c1c1e;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.2);transform:translateY(80px);opacity:0;transition:transform .3s,opacity .3s}
.toast-inner.show{transform:translateY(0);opacity:1}
</style>
</head>
<body>

<div class="hd">
  <div class="br"><img src="logo.png" alt=""><b>栄ガーデン</b></div>
  <div class="dt" id="clock-date"></div>
</div>
<div class="big" id="clock-time"></div>

<div class="seg" id="seg"></div>
<div class="pages" id="pages"></div>
<div class="dots" id="dots"></div>

<div class="toast"><div class="toast-inner" id="toast"></div></div>

<script>
// ページ（左右のスワイプで切り替え）。アプリの並びは 左上→右上→左下→右下。
const PAGES = [
  { id:'haitatsu', label:'配達', apps:[
    { icon:'ti-clipboard-list',  name:'日報',       url:'https://sakae-garden.github.io/nippo/',                 color:'green'  },
    { icon:'ti-building-store',  name:'卸販売',     url:'https://sakae-garden.github.io/oroshi.html',            color:'orange' },
    { icon:'ti-chart-bar',       name:'サマリー',   url:'https://sakae-garden.github.io/nippo/summary.html',     color:'blue'   },
    { icon:'ti-package',         name:'配達商品',   url:'https://sakae-garden.github.io/nippo/haitatsu.html',    color:'purple' },
    // 店舗依頼ボード（2026-10-03 杉さん了承）
    { icon:'ti-clipboard-text',  name:'店舗依頼',   url:'https://sakae-garden.github.io/nippo/irai.html',        color:'teal'   },
  ]},
  { id:'house', label:'ハウス作業', apps:[
    // 袋出し記録・栽培シフトは別リポジトリの Project Pages のため絶対URL
    { icon:'ti-mushroom',   name:'袋出し記録',   url:'https://sakae-garden.github.io/nippo/fukurodashi.html',         color:'teal'   },
    { icon:'ti-droplet',    name:'浸水記録',     url:'#',                                                             color:'blue',   wip:true },
    { icon:'ti-scissors',   name:'刈り取り記録', url:'#',                                                             color:'orange', wip:true },
    { icon:'ti-calendar',   name:'栽培シフト',   url:'https://sakae-garden.github.io/eigarden-shift-app/saibai.html', color:'green'  },
    // 袋詰めの管理画面（杉さん用。パスコードあり。2026-10-15）
    { icon:'ti-chart-line', name:'袋詰め管理',   url:'https://sakae-garden.github.io/nippo/fukurozume-kanri.html',    color:'purple' },
  ]},
];
// 資金繰り・出荷情報・袋詰め指示／確認はランチャー非掲載（URL直アクセスのみ。従来どおり）。

const seg = document.getElementById('seg'), pages = document.getElementById('pages'), dots = document.getElementById('dots');
PAGES.forEach((pg, idx) => {
  const b = document.createElement('button'); b.type='button'; b.textContent = pg.label;
  b.addEventListener('click', () => goPage(idx, true)); seg.appendChild(b);
  const sec = document.createElement('div'); sec.className = 'page';
  const grid = document.createElement('div'); grid.className = 'grid';
  pg.apps.forEach(app => {
    const a = document.createElement('a');
    a.href = app.wip ? '#' : app.url;
    a.className = 'app' + (app.wip ? ' wip' : '');
    a.innerHTML = `<span class="ic" data-c="${app.color}"><i class="ti ${app.icon}" aria-hidden="true"></i></span><span class="nm">${app.name}</span>`;
    if (app.wip) a.addEventListener('click', e => { e.preventDefault(); showToast('このアプリは現在準備中です'); });
    grid.appendChild(a);
  });
  sec.appendChild(grid); pages.appendChild(sec);
  dots.appendChild(document.createElement('i'));
});

let cur = -1;
function setActive(idx){
  if (idx === cur) return; cur = idx;
  [...seg.children].forEach((b,i) => b.classList.toggle('on', i===idx));
  [...dots.children].forEach((d,i) => d.classList.toggle('on', i===idx));
  try { history.replaceState(null, '', idx === 0 ? location.pathname : '#' + PAGES[idx].id); } catch(e){}
}
function goPage(idx, smooth){
  pages.scrollTo({ left: idx * pages.clientWidth, behavior: smooth ? 'smooth' : 'auto' });
  setActive(idx);
}
pages.addEventListener('scroll', () => {
  const w = pages.clientWidth || 1;
  setActive(Math.max(0, Math.min(PAGES.length-1, Math.round(pages.scrollLeft / w))));
}, { passive:true });
function pageFromHash(){
  const h = (location.hash || '').replace('#','');
  const i = PAGES.findIndex(p => p.id === h);
  return i < 0 ? 0 : i;
}
goPage(pageFromHash(), false);
window.addEventListener('resize', () => goPage(cur < 0 ? 0 : cur, false));
window.addEventListener('pageshow', () => goPage(pageFromHash(), false));

function updateClock() {
  const now = new Date();
  const wd = ['日','月','火','水','木','金','土'][now.getDay()];
  document.getElementById('clock-date').textContent = `${now.getMonth()+1}月${now.getDate()}日（${wd}）`;
  document.getElementById('clock-time').textContent = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
}
updateClock();
setInterval(updateClock, 10000);

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
