<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>出荷情報 - 栄ガーデン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans JP',sans-serif;background:#f5f0e8;color:#2c2c2e;min-height:100vh;padding-bottom:80px}

header{background:#2c3e2d;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-size:16px;font-weight:700}
header .back{color:#a8d5a2;text-decoration:none;font-size:14px}

.container{max-width:560px;margin:0 auto;padding:14px}

/* ── 共通条件カード ── */
.cond-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.cond-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cond-grid .full{grid-column:1 / -1}
.cond-grid label{display:block;font-size:11px;font-weight:600;color:#666;margin-bottom:3px;letter-spacing:.5px}
.cond-grid select,.cond-grid input{width:100%;padding:8px 10px;border:1.5px solid #d0c8b8;border-radius:8px;font-size:14px;font-family:inherit;background:#faf8f4;-webkit-appearance:none}
.cond-grid select:focus,.cond-grid input:focus{outline:none;border-color:#2c3e2d;background:#fff}

/* ── ルートタブ ── */
.route-tabs{display:flex;background:#fff;border-radius:10px;padding:4px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.route-tab{flex:1;padding:11px 4px;text-align:center;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;color:#888}
.route-tab.active{background:#2c3e2d;color:#fff}

/* ── ルートメモ（赤字） ── */
.route-memo{background:#fff5f5;border:1.5px solid #f5d0d0;border-left:5px solid #c0392b;border-radius:8px;padding:10px 12px;margin-bottom:14px;color:#c0392b;font-size:13px;font-weight:500;line-height:1.5}
.route-memo:empty{display:none}

/* ── グループ ── */
.group{background:#fff;border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.group-header{padding:10px 14px;background:#2c3e2d;color:#fff;font-size:14px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;justify-content:space-between}
.group-header .gsum{font-size:13px;font-weight:600;color:#a8d5a2}

.store{padding:10px 14px;border-bottom:1px solid #efe8d8}
.store:last-child{border-bottom:none}
.store-name{font-size:14px;font-weight:700;color:#2c3e2d;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.store-name .fix-tag{font-size:10px;background:#888;color:#fff;padding:2px 7px;border-radius:8px;font-weight:600}

.price-row{display:grid;grid-template-columns:56px 1fr 1fr 1fr;gap:6px;align-items:center;padding:5px 0;font-size:12px}
.price-row .pr-label{font-size:11px;font-weight:700;color:#666;text-align:center;background:#f5f0e8;padding:4px 0;border-radius:4px}
.price-row .pr-calc{text-align:center;color:#888;font-size:11px}
.price-row .pr-calc strong{color:#2c3e2d;font-size:14px;font-weight:700;display:block;margin-top:1px}
.price-row .pr-prev input,.price-row .pr-ship input{
  width:100%;padding:6px 4px;border:1.5px solid #d0c8b8;border-radius:6px;
  font-size:15px;font-family:inherit;background:#faf8f4;text-align:center;-webkit-appearance:none;font-weight:700}
.price-row .pr-prev input{background:#fff5e8;color:#856404}
.price-row .pr-ship input{background:#e8f5e8;color:#155724}
.price-row .pr-ship input:focus,.price-row .pr-prev input:focus{outline:none;border-color:#2c3e2d}
.price-row .pr-ship input.manual{background:#cce5ff;color:#004085;border-color:#4a90e2}

.price-head{display:grid;grid-template-columns:56px 1fr 1fr 1fr;gap:6px;padding:5px 0;font-size:10px;color:#888;font-weight:600;text-align:center;letter-spacing:.5px}

/* 前日在庫折りたたみ */
.prev-card{background:#fff;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
.prev-card .prev-head{padding:12px 14px;background:#faf8f4;font-size:13px;font-weight:700;color:#2c3e2d;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.prev-card[data-open="false"] .prev-body{display:none}
.prev-card[data-open="false"] .prev-toggle{transform:rotate(-90deg)}
.prev-toggle{transition:transform .2s;font-size:14px}
.prev-body{padding:12px}
.prev-list .ps{padding:8px 0;border-bottom:1px dashed #d0c8b8;font-size:12px}
.prev-list .ps:last-child{border-bottom:none}
.prev-list .ps-name{font-weight:700;color:#2c3e2d;margin-bottom:4px}
.prev-list .ps-prices{display:flex;flex-wrap:wrap;gap:4px}
.prev-list .ps-prices span{background:#f5f0e8;padding:2px 8px;border-radius:4px;color:#666;font-size:11px}
.prev-list .ps-prices strong{color:#2c3e2d;margin-left:3px}

/* 合計バー */
.total-bar{background:#1c1c1e;color:#fff;border-radius:10px;padding:12px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.total-bar .label{font-size:13px;color:#a8d5a2;font-weight:600}
.total-bar .value{font-size:22px;font-weight:900;letter-spacing:1px}

.btn-reset{display:block;width:100%;padding:10px;background:#fff;color:#666;border:1.5px dashed #d0c8b8;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:14px}
.btn-reset:active{background:#faf8f4}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back">&lt; ホーム</a>
  <h1>出荷情報</h1>
  <span></span>
</header>

<div class="container">

  <!-- 共通条件 -->
  <div class="cond-card">
    <div class="cond-grid">
      <div class="full">
        <label>対象日</label>
        <input type="date" id="target-date" onchange="recalcAll()">
      </div>
      <div>
        <label>天気</label>
        <select id="weather" onchange="recalcAll()">
          <option value="晴">晴 ×1.00</option>
          <option value="曇">曇 ×0.95</option>
          <option value="雨">雨 ×0.80</option>
          <option value="雪">雪 ×0.60</option>
        </select>
      </div>
      <div>
        <label>特設・チラシ</label>
        <select id="event" onchange="recalcAll()">
          <option value="通常">通常 ×1.00</option>
          <option value="チラシ">チラシ ×1.30</option>
          <option value="特設">特設 ×1.50</option>
          <option value="チラシ+特設">チラシ+特設 ×1.80</option>
          <option value="お盆・お彼岸">お盆・お彼岸 ×1.20</option>
          <option value="BBQ・アウトドア">BBQ・アウトドア ×1.15</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ルートタブ -->
  <div class="route-tabs" id="route-tabs"></div>

  <!-- ルートメモ -->
  <div class="route-memo" id="route-memo"></div>

  <!-- 合計 -->
  <div class="total-bar">
    <span class="label">ルート出荷合計</span>
    <span class="value" id="route-total">0 袋</span>
  </div>

  <!-- グループリスト -->
  <div id="groups"></div>

  <button class="btn-reset" onclick="resetOverrides()">手動上書きをリセット</button>

  <!-- 前日在庫 -->
  <div class="prev-card" data-open="false">
    <div class="prev-head" onclick="togglePrev()">
      <span>📦 前日残在庫を表示 / 編集</span>
      <span class="prev-toggle">▼</span>
    </div>
    <div class="prev-body">
      <div id="prev-list" class="prev-list"></div>
    </div>
  </div>

</div>

<script>
// ============================================================
// 設定データ（shipping_config.py から移植）
// ============================================================
const BASE_STOCK = {
  // 小川ルート
  'ヤオコー寄居店':          {route:'小川ルート', prices:{99:20, 198:40, 398:5}},
  'ヤオコーみどりが丘店':     {route:'小川ルート', prices:{99:20, 198:30, 398:5}},
  '男衾農産物直売所':         {route:'小川ルート', prices:{200:20, 380:20}},
  '川本農産物直売所':         {route:'小川ルート', prices:{200:20, 380:20}},
  'ハーズ':                  {route:'小川ルート', fixed:true, prices:{99:'固定',198:'固定',398:'固定',598:'固定'}},
  '深谷ベジタブル':           {route:'小川ルート', fixed:true, prices:{99:'固定',198:'固定',398:'固定',598:'固定'}},
  'やおとも':                {route:'小川ルート', fixed:true, prices:{99:'固定',198:'固定',398:'固定',598:'固定'}},
  '農林公園':                {route:'小川ルート', prices:{200:10, 380:10}},
  '道の駅おがわまち':         {route:'小川ルート', prices:{200:5, 380:5}},
  // 籠原ルート
  'ヤオコー皆野店':           {route:'籠原ルート', prices:{99:20, 198:40, 398:10}},
  'ヤオコー籠原店':           {route:'籠原ルート', prices:{99:20, 198:40, 398:5}},
  'ヤオコー本庄中央店':        {route:'籠原ルート', prices:{99:20, 198:40, 398:5}},
  'ヤオコー上里店':           {route:'籠原ルート', prices:{99:20, 198:60, 398:5}},
  'ヤオコー児玉バイパス店':    {route:'籠原ルート', prices:{99:20, 198:30, 398:5}},
  '道の駅おかべ':            {route:'籠原ルート', prices:{200:20, 380:20}},
  // 坂戸ルート
  'ヤオコー長瀬店':           {route:'坂戸ルート', prices:{99:20, 198:30, 398:5}},
  'ヤオコー一本松南店':        {route:'坂戸ルート', prices:{99:20, 198:20, 398:5}},
  'ヤオコーワカバウォーク店':  {route:'坂戸ルート', prices:{99:20, 198:50, 398:10}},
  'ヤオコー坂戸千代田店':      {route:'坂戸ルート', prices:{99:20, 198:20, 398:5}},
  'ヤオコー坂戸泉店':         {route:'坂戸ルート', prices:{99:20, 198:30, 398:5}},
  'ヤオコー東松山新宿店':      {route:'坂戸ルート', prices:{99:20, 198:50, 398:5}},
  '道の駅おけがわ':          {route:'坂戸ルート', prices:{200:5, 380:5}},
};

const WEEKDAY_COEF = {'月':1.00,'火':1.20,'水':1.05,'木':1.00,'金':1.00,'土':1.50,'日':1.50};
const WEATHER_COEF = {'晴':1.00,'曇':0.95,'雨':0.80,'雪':0.60};
const MONTH_COEF_YAOKO = {1:1.115,2:1.048,3:0.943,4:0.754,5:0.743,6:0.628,7:0.669,8:0.744,9:0.880,10:1.203,11:1.328,12:1.944};
const MONTH_COEF_CHOKUBAIJO = {1:1.096,2:1.096,3:0.986,4:0.986,5:0.767,6:0.822,7:1.096,8:1.096,9:0.986,10:0.986,11:0.986,12:1.096};
const EVENT_COEF = {'通常':1.00,'チラシ':1.30,'特設':1.50,'チラシ+特設':1.80,'お盆・お彼岸':1.20,'BBQ・アウトドア':1.15};
const CHOKUBAIJO_STORES = ['男衾農産物直売所','川本農産物直売所','道の駅おかべ'];

const WEEKDAYS = ['日','月','火','水','木','金','土'];

const ROUTES = ['小川ルート','籠原ルート','坂戸ルート'];

// ルート別 補足メモ
const ROUTE_MEMO = {
  '小川ルート': '※ ハーズ・深谷ベジタブル・やおともは固定納品（数量は別途連絡）。\n※ 道の駅おがわまちは午前納品厳守。',
  '籠原ルート': '※ 道の駅おかべは直売所係数を使用（夏場は需要安定）。\n※ ヤオコー児玉バイパス店は出荷量にバラつきあり、要確認。',
  '坂戸ルート': '※ ヤオコー坂戸千代田店・一本松南店は¥198の売れ行き弱め、過剰在庫注意。\n※ ヤオコー東松山新宿店は¥198の動きが良い。',
};

// グループ分類
function categorize(store) {
  if (store.startsWith('ヤオコー')) return 'ヤオコー';
  if (store.startsWith('道の駅')) return '道の駅';
  if (store.includes('直売所') || store === '農林公園') return '直売所';
  return 'その他';
}

const GROUP_ORDER = ['ヤオコー','直売所','道の駅','その他'];

// ============================================================
// 状態
// ============================================================
let currentRoute = '小川ルート';
// overrides[store][price] = number  (手動出荷数)
let overrides = {};
// prevStock[store][price] = number  (前日残在庫)
let prevStock = {};

// localStorage キー（日付ごと）
function storageKey(date) { return `shipping_${date}`; }

function loadState() {
  const date = document.getElementById('target-date').value;
  const raw = localStorage.getItem(storageKey(date));
  if (raw) {
    try {
      const s = JSON.parse(raw);
      overrides = s.overrides || {};
      prevStock = s.prevStock || {};
    } catch(e) { overrides = {}; prevStock = {}; }
  } else {
    overrides = {};
    prevStock = {};
  }
}

function saveState() {
  const date = document.getElementById('target-date').value;
  localStorage.setItem(storageKey(date), JSON.stringify({overrides, prevStock}));
}

// ============================================================
// 計算
// ============================================================
function getMonthCoef(store, month) {
  return CHOKUBAIJO_STORES.includes(store) ? MONTH_COEF_CHOKUBAIJO[month] : MONTH_COEF_YAOKO[month];
}

function computeSuggested(store, price) {
  const info = BASE_STOCK[store];
  if (!info) return null;
  const base = info.prices[price];
  if (base == null || base === '固定') return null;
  const date = new Date(document.getElementById('target-date').value + 'T00:00:00');
  const month = date.getMonth() + 1;
  const dow = WEEKDAYS[date.getDay()];
  const monthC = getMonthCoef(store, month);
  const dowC = WEEKDAY_COEF[dow];
  const weaC = WEATHER_COEF[document.getElementById('weather').value];
  const evtC = EVENT_COEF[document.getElementById('event').value];
  const target = base * monthC * dowC * weaC * evtC;
  const prev = (prevStock[store] && prevStock[store][price]) || 0;
  const ship = Math.max(0, Math.round(target - prev));
  return {base, monthC, dowC, weaC, evtC, target, prev, ship};
}

// ============================================================
// 描画
// ============================================================
function renderRouteTabs() {
  document.getElementById('route-tabs').innerHTML = ROUTES.map(r =>
    `<div class="route-tab ${r===currentRoute?'active':''}" onclick="selectRoute('${r}')">${r.replace('ルート','')}</div>`
  ).join('');
}

function selectRoute(r) {
  currentRoute = r;
  renderRouteTabs();
  renderGroups();
}

function renderRouteMemo() {
  const memo = ROUTE_MEMO[currentRoute] || '';
  document.getElementById('route-memo').textContent = memo;
}

function storesInRoute() {
  return Object.keys(BASE_STOCK).filter(s => BASE_STOCK[s].route === currentRoute);
}

function renderGroups() {
  renderRouteMemo();
  const stores = storesInRoute();
  const byGroup = {};
  stores.forEach(s => {
    const g = categorize(s);
    if (!byGroup[g]) byGroup[g] = [];
    byGroup[g].push(s);
  });

  let html = '';
  let routeTotal = 0;
  GROUP_ORDER.forEach(g => {
    if (!byGroup[g] || byGroup[g].length === 0) return;
    let groupSum = 0;
    let inner = '';
    byGroup[g].forEach(store => {
      const info = BASE_STOCK[store];
      const prices = Object.keys(info.prices).map(Number).sort((a,b)=>a-b);
      let rows = `<div class="price-head">
        <span>価格</span><span>提案計算</span><span>前日残</span><span>出荷数</span>
      </div>`;
      prices.forEach(price => {
        const calc = computeSuggested(store, price);
        const ov = (overrides[store] && overrides[store][price] != null) ? overrides[store][price] : null;
        const isManual = ov !== null;
        if (calc === null) {
          // 固定 or None
          const label = info.prices[price] === '固定' ? '固定納品' : '−';
          rows += `<div class="price-row">
            <span class="pr-label">¥${price}</span>
            <span class="pr-calc"><strong>${label}</strong></span>
            <span class="pr-prev">—</span>
            <span class="pr-ship">—</span>
          </div>`;
        } else {
          const ship = isManual ? ov : calc.ship;
          groupSum += ship;
          rows += `<div class="price-row">
            <span class="pr-label">¥${price}</span>
            <span class="pr-calc" title="基準${calc.base} × 月${calc.monthC.toFixed(2)} × 曜${calc.dowC.toFixed(2)} × 天${calc.weaC.toFixed(2)} × 特${calc.evtC.toFixed(2)} = ${calc.target.toFixed(1)}">
              <span>基準${calc.base}</span><strong>${calc.target.toFixed(0)}</strong>
            </span>
            <span class="pr-prev">
              <input type="number" inputmode="numeric" min="0" step="1" value="${calc.prev}"
                onchange="onPrevChange('${store}', ${price}, this.value)">
            </span>
            <span class="pr-ship">
              <input type="number" inputmode="numeric" min="0" step="1" value="${ship}" class="${isManual?'manual':''}"
                onchange="onShipChange('${store}', ${price}, this.value)">
            </span>
          </div>`;
        }
      });
      const fixTag = info.fixed ? '<span class="fix-tag">固定</span>' : '';
      inner += `<div class="store">
        <div class="store-name"><span>${store}</span>${fixTag}</div>
        ${rows}
      </div>`;
    });
    routeTotal += groupSum;
    html += `<div class="group">
      <div class="group-header"><span>${g}</span><span class="gsum">${groupSum} 袋</span></div>
      ${inner}
    </div>`;
  });
  document.getElementById('groups').innerHTML = html;
  document.getElementById('route-total').textContent = routeTotal + ' 袋';
  renderPrevList();
}

function renderPrevList() {
  // 全ルートの前日残在庫一覧
  let html = '';
  ROUTES.forEach(route => {
    const stores = Object.keys(BASE_STOCK).filter(s => BASE_STOCK[s].route === route);
    let routeHtml = '';
    stores.forEach(store => {
      const info = BASE_STOCK[store];
      if (info.fixed) return;
      const prices = Object.keys(info.prices).map(Number).sort((a,b)=>a-b);
      const parts = prices.map(price => {
        const base = info.prices[price];
        if (base === '固定' || base == null) return '';
        const prev = (prevStock[store] && prevStock[store][price]) || 0;
        return `<span>¥${price} <strong>${prev}</strong></span>`;
      }).filter(Boolean).join('');
      if (parts) routeHtml += `<div class="ps"><div class="ps-name">${store}</div><div class="ps-prices">${parts}</div></div>`;
    });
    if (routeHtml) html += `<div style="margin-bottom:10px"><strong style="color:#2c3e2d;font-size:12px">${route}</strong>${routeHtml}</div>`;
  });
  document.getElementById('prev-list').innerHTML = html;
}

function togglePrev() {
  const el = document.querySelector('.prev-card');
  el.dataset.open = el.dataset.open === 'true' ? 'false' : 'true';
}

// ============================================================
// イベント
// ============================================================
function onPrevChange(store, price, val) {
  const n = parseInt(val) || 0;
  if (!prevStock[store]) prevStock[store] = {};
  prevStock[store][price] = n;
  saveState();
  renderGroups();
}

function onShipChange(store, price, val) {
  const n = parseInt(val) || 0;
  if (!overrides[store]) overrides[store] = {};
  overrides[store][price] = n;
  saveState();
  renderGroups();
}

function resetOverrides() {
  if (!confirm('手動上書きをすべてリセットしますか？\n（前日在庫の入力値は残ります）')) return;
  overrides = {};
  saveState();
  renderGroups();
}

function recalcAll() {
  loadState();
  renderGroups();
}

// ============================================================
// 初期化
// ============================================================
(function init(){
  const t = new Date();
  const y = t.getFullYear();
  const m = String(t.getMonth()+1).padStart(2,'0');
  const d = String(t.getDate()).padStart(2,'0');
  document.getElementById('target-date').value = `${y}-${m}-${d}`;
  loadState();
  renderRouteTabs();
  renderGroups();
})();
</script>

<footer style="position:fixed;bottom:0;left:0;width:100%;height:52px;background:#1c1c1e;display:flex;align-items:center;justify-content:center;z-index:100">
  <a href="https://sakae-garden.github.io/" style="color:#fff;text-decoration:none;font-size:15px;font-weight:500">🏠 ホームに戻る</a>
</footer>
</body>
</html>
