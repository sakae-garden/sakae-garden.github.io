<!--
  袋出し管理（指示 20261117-0850。杉さん承認 2026-11-17 08:38）。中の従業員向け。
  - 仕入れ：入荷予定（nyuka.list）を月のカレンダーで読むだけ。チャーター便＝青・引き取り（杉さん軽バン含む）＝橙・分からない値＝灰
  - 棚：tana.list／tana.add／tana.clear（GAS Tana.gs）。面の名前は「C-左2」（棚 A〜・面 左／右・奥 1＝入口側）
  - ログインは作業記録と同じ（名前を選ぶだけ。SgLogin.initWork）
  - 作業記録の袋出し（生産記録）とはつながない（第1版）
  - 直し1（指示 20261117-1050）：棚の拠点は見出しの下の2ボタン（棚のときだけ）。仕入れは拠点を分けない
  - 直し2（指示 20261117-1102）：仕入れは Cloud Run nippo-api の nyukaList（ログイン不要・入荷一覧と同じ）から読み、
    月ごとにスマホに覚えて開いたらまずそれを出す（読めなければ GAS の nyuka.list）。読み込み中はカレンダー・棚の上に「読み込み中…」。
    棚は GAS のまま。前の GAS の通信から5.5時間たっていたら（ログインは6時間で切れる）ログインと tana.list を並べて呼ぶ
  - 直し2（指示 20261117-1120）：拠点は見出しの右上に小さく。記録の画面は「袋出し済み｜袋出し予約」・並べた日（今日｜日付を選ぶ）・
    面は押して選ぶ／長押しでなぞって続けて選ぶ・合計の個数（選んだ順に1面の個数ずつ、端数は最後の面）。
    予約の面は赤（tana.add reserve）。押すと「袋出し済みにする」（tana.done）か「予約をやめる」（tana.cancel）。
    面を押したかどうかは指を離したとき（pointerup）に、押し始めた面で決める（押している間に棚が描き直されても取りこぼさない）
  - 直し3（指示 20261117-1255）：記録の画面で、空きが残っている面（置いている個数＜1面の個数）も選べる（個数は残りの数。2つ目の日付になる）。
    見出しの右上に ↻（棚と仕入れを読み直す）。新しい版が出ていたら開いたとき・戻ったときに読み直す（下の sg-build）
  - 直し4（指示 20261117-1315）：埋まっている面を押すと「直す」画面。並べた日ごとに並べた日・個数を直して保存（tana.edit）、
    「入れ間違いを消す」（tana.void。行は消さず 取り消し）。空の面を押すとその面を選んだ記録の画面（今までどおり）
  - 直し5（指示 20261117-1340）：長押しをすべてなくした（棚の複数選択・記録の画面のなぞる）。面はタップだけ（空＝記録／置いている＝直す／予約＝済み・やめる）。
    下から出る画面はスマホの「戻る」・左上の ×・暗い所で閉じて棚に戻る（history.pushState／popstate）。
    空にする・入れ間違いを消す・予約をやめるは確認を出さず、下に5秒「元に戻す」（同じ面・日・個数で tana.add し直す。GAS は変えない）。
    記録・保存の後は面を光らせて「記録しました」等を1秒。20日超の点は黒（予約の赤と分ける）。読み込み中は面を押せない
  - 直し6（指示 20261117-1535）：記録・保存・空にする・予約・済みにする・やめる・元に戻すは、押したらすぐ閉じて棚を書き換え、送るのは裏で1件ずつ
    （順番待ちはスマホに覚えて次に開いたときも続ける。送り終えていない面には左上に ⟳。通信の失敗は3回まで送り直し、だめなら元に戻す）。
    送っている途中の面は送り終えるまで開かない。直す画面の「入れ間違いを消す」をなくし「空にする」（面ごと）・「この日の分を空にする」（行ごと）に。
    記録してから24時間以内なら tana.void（数えない）、過ぎたら tana.clear を画面が選ぶ
  - 直し7（指示 20261117-2302）：iPhone で「日付を選ぶ」が開かなかった（隠した input を showPicker()／click() で開く作りは iOS では開かない）。
    ボタンの上に透明な本物の input type=date を重ね、指が直接触れるようにした（記録の画面・予約の日・直す画面の並べた日）。範囲外は理由を出す
  - 直し8（指示 20261118-1015）：タブを「仕入れ｜栽培舎｜培養舎」に（棚→栽培舎）。記録の画面に「① 菌床 月夜野（完熟）｜栄（自社培養）」（初期値 月夜野。
    tana.add kinsho）。栄で済みにすると GAS が培養舎の一番古い仕入れ分から減らす（予約は済みにしたとき）。残りが足りなければ記録しない。
    栽培舎の面に小さな「栄」の印。培養舎タブ＝拠点ごとの仕入れ分（baiyou.list。古い順・一番古い分に「次に出す分」）・行を押して個数を直す
    （baiyou.adjust）・「＋ 仕入れを足す」（baiyou.add）。どちらも誰でも。送るのは棚と同じ順番待ち
  - 直し9（指示 20261126-2205）：同じ日に置いた月夜野と栄が1色に見えた。面の中を「並べた日＋菌床」の組で分け（同じ日でも斜めの2色）、
    栄の部分は日付の色の上に斜線＋太めの濃い緑の枠・「栄」の札を大きく。数字は「月29」「栄13」の2行（同じ日）・「29+栄13」（日が違う）。
    凡例に「斜線＝栄（自社培養）」。直す・予約・記録の画面の面と色見本も同じ斜線
-->

.btot b{font-size:34px;font-weight:700}.btot small{font-size:16px;margin-left:4px}
.lot{display:flex;justify-content:space-between;align-items:center;width:calc(100% - 24px);margin:0 12px 8px;min-height:60px;padding:12px 16px;background:#fff;border-radius:12px;text-align:left}
.lot.next{box-shadow:inset 5px 0 0 #e0a526}
.lot .ld{font-size:16px}.lot .ld small{display:block;font-size:12px;color:#888;margin-top:2px}
.lot .lc{font-size:14px;white-space:nowrap}.lot .lc b{font-size:22px;margin-right:3px}
.lot .pd{display:inline-block;margin-left:6px;color:#1f6fd1;animation:spin 1.2s linear infinite}
.addlot{display:block;width:calc(100% - 24px);margin:6px 12px;padding:14px;border:1.5px dashed #2f5d3a;border-radius:12px;color:#2f5d3a;font-size:16px;font-weight:700;text-align:center}
.bnone{margin:0 12px 8px;padding:16px;background:#fff;border-radius:12px;color:#888;font-size:14px}
.upc{margin:10px 16px;font-size:13px;color:#777}
.upc:empty{display:none}
#bLoad{top:6px}
.cnt{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:16px}
.cnt input{width:140px;height:50px;font-size:24px;font-weight:700;text-align:center;border:2px solid #1f6fd1;border-radius:10px;font-family:inherit;color:#222;outline:none}
</style>
</head>
<body>
<div class="top"><span>袋出し管理</span><div class="tr"><div class="sites off" id="siteSeg"><button type="button" data-s="yorii">寄居</button><button type="button" data-s="shinrin">森林公園</button></div><button type="button" class="rl" id="reload" aria-label="読み直す">↻</button></div></div>
<div class="tabs" id="tabs"><button type="button" data-tab="shiire">仕入れ</button><button type="button" data-tab="tana">栽培舎</button><button type="button" data-tab="baiyou">培養舎</button></div>

<div class="panel" id="p_shiire" hidden>
  <div class="mon"><button type="button" id="prevMon" aria-label="前の月">‹</button><span id="monTitle"></span><button type="button" id="nextMon" aria-label="次の月">›</button></div>
  <div class="msg" id="calMsg"></div>
  <div class="calwrap"><table class="cal" id="cal"></table><div class="loading" id="calLoad" hidden>読み込み中…</div></div>
  <div class="leg"><span><i style="background:#2b6cb0"></i>チャーター便</span><span><i style="background:#dd7a1f"></i>引き取り</span></div>
  <div class="list" id="dayList"></div>
</div>

<div class="panel" id="p_tana" hidden>
  <div class="seg" id="roomSeg"></div>
  <div class="sum" id="tanaSum"></div>
  <div class="msg" id="tanaMsg"></div>
  <div class="pwrap"><div class="pager" id="pager"></div><div class="loading" id="tanaLoad" hidden>読み込み中…</div></div>
  <div class="pg" id="pg"></div>
  <div class="tleg" id="tleg"></div>
  <div class="spacer"></div>
</div>

<div class="panel" id="p_baiyou" hidden>
  <div class="btot"><span>培養舎の菌床</span><span><b id="bTotal">–</b><small>個</small></span></div>
  <div class="msg" id="bMsg"></div>
  <div class="pwrap"><div id="bList"></div><div class="loading" id="bLoad" hidden>読み込み中…</div></div>
  <button type="button" class="addlot" id="bAdd">＋ 仕入れを足す</button>
  <div class="upc" id="bUpc"></div>
  <div class="spacer"></div>
</div>
<div class="foot" id="foot" hidden><button type="button" class="btn" id="recBtn">袋出しを記録</button></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" id="toastUndo" hidden>元に戻す</button></div>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
<script>
(function () {
  'use strict';
  var C = window.TougouCommon, L = window.SgLogin;
  var SITES = { yorii: '寄居', shinrin: '森林公園' };
  var WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  var PAL = ['#7fb3e6', '#8fd19e', '#f2c46d', '#e9a0b8', '#b9a3e3', '#7fd3cf', '#f0a374', '#c5d86d', '#d9b38c', '#a7c7e7'];
  var OLD_DAYS = 20;
  var LS = { site: 'sg.fukuro.site', tab: 'sg.fukuro.tab', tana: 'sg.fukuro.tana.', nyuka: 'sg.fukuro.nyuka.', okAt: 'sg.fukuro.okAt', bai: 'sg.fukuro.baiyou.' };
  var SAKAE = '栄';
  var BOARD_API = 'https://nippo-api-7lc5gs4g6q-an.a.run.app/api';
  var STALE_MS = 5.5 * 3600 * 1000;   // GAS のログインは最後に使ってから6時間で切れる
  var NYUKA_KEEP_MONTHS = 3;          // 覚えた仕入れは今月の3か月前より古い月を消す

  function $(id) { return document.getElementById(id); }
  function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function lsPut(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 覚えられないだけ */ } }
  function esc(s) { return C.esc(s); }
  function num(n) { return Number(n).toLocaleString(); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymdOf(y, m, d) { var t = new Date(y, m - 1, d); return t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); }
  function parts(ymd) { return String(ymd).split('-').map(Number); }
  function addDays(ymd, n) { var p = parts(ymd); return ymdOf(p[0], p[1], p[2] + n); }
  function md(ymd) { var p = parts(ymd); return p[1] + '/' + p[2]; }
  function dayNo(ymd) { var p = parts(ymd); return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); }
  /** 並べた日の色。拠点の中で日付の順に振る（同じ拠点で10日分までは別の色） */
  var colors = {};
  function setColors(d) {
    var ds = {}; colors = {};
    (d && d.faces || []).forEach(function (x) { if (!x.reserve) ds[x.date] = 1; });
    Object.keys(ds).sort().forEach(function (x, i) { colors[x] = PAL[i % PAL.length]; });
  }
  function colorOf(ymd) { return colors[ymd] || '#ddd'; }
  function newId() { return 'T' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  var today = C.ymd(C.now());
  var st = {
    site: lsGet(LS.site) === 'shinrin' ? 'shinrin' : 'yorii',
    tab: ['shiire', 'baiyou'].indexOf(lsGet(LS.tab)) >= 0 ? lsGet(LS.tab) : 'tana',
    calYm: today.slice(0, 7), calSel: today, nyuka: {}, nyukaAt: {}, calBusy: {},
    tana: {}, tanaBusy: {}, view: 0, bai: {}, baiBusy: {}
  };
  /** GAS を呼ぶ（成功した時刻を覚え、ログインが切れていそうかの目安にする） */
  function gas(action, params) {
    return C.api(action, params).then(function (res) { lsPut(LS.okAt, Date.now()); return res; });
  }

  // ---------------------------------------------------------------- 画面の切り替え
  function setTab(t) {
    st.tab = t; lsPut(LS.tab, t);
    Array.prototype.forEach.call($('tabs').children, function (b) { b.classList.toggle('on', b.dataset.tab === t); });
    $('p_shiire').hidden = t !== 'shiire';
    $('p_tana').hidden = t !== 'tana';
    $('p_baiyou').hidden = t !== 'baiyou';
    $('siteSeg').classList.toggle('off', t === 'shiire');   // 栽培舎・培養舎は拠点ごと（仕入れは拠点を分けない）
    $('foot').hidden = t !== 'tana';
    if (t === 'shiire') loadMonth(st.calYm);
    else if (t === 'tana') { renderTana(); loadTana(st.site); }
    else { renderBaiyou(); loadBaiyou(st.site); }
  }
  $('tabs').onclick = function (e) { var b = e.target.closest('button'); if (b) setTab(b.dataset.tab); };
  function drawSites() {
    Array.prototype.forEach.call($('siteSeg').children, function (b) { b.classList.toggle('on', b.dataset.s === st.site); });
  }
  function setSite(s) {
    st.site = s; lsPut(LS.site, s);
    drawSites();
    st.view = 0;   // 部屋は「左」に戻す
    if (st.tab === 'tana') { renderTana(); loadTana(s); }
    if (st.tab === 'baiyou') { renderBaiyou(); loadBaiyou(s); }
  }
  $('siteSeg').onclick = function (e) { var b = e.target.closest('button'); if (b && b.dataset.s !== st.site) setSite(b.dataset.s); };
  /** ↻：棚（GAS）と仕入れ（Cloud Run）をその場で読み直す。読んでいる間は ↻ を薄くし、カレンダー・棚の上に「読み込み中…」 */
  function drawReload() { $('reload').classList.toggle('busy', !!(st.calBusy[st.calYm] || st.tanaBusy[st.site] || st.baiBusy[st.site])); }
  $('reload').onclick = function () {
    st.nyukaAt[st.calYm] = 0; loadMonth(st.calYm, st.tab === 'shiire');
    if (st.tab === 'tana' && !st.tanaBusy[st.site]) loadTana(st.site, true);
    if (st.tab === 'baiyou' && !st.baiBusy[st.site]) loadBaiyou(st.site, true);
  };

  // ---------------------------------------------------------------- 仕入れ（入荷予定のカレンダー）
  /** 便の種類 → 色（c＝チャーター便・青／h＝引き取り・橙／g＝分からない・灰） */
  function binClass(bin) {
    var b = String(bin || '');
    if (/チャーター|遠州/.test(b)) return 'c';
    if (/引き?取|軽バン|トラック/.test(b)) return 'h';
    return 'g';
  }
  function monthRange(ym) {
    var p = ym.split('-').map(Number);
    return { y: p[0], m: p[1], from: ymdOf(p[0], p[1], 1), to: ymdOf(p[0], p[1] + 1, 0) };
  }
  function shiftYm(ym, n) { var p = ym.split('-').map(Number); return ymdOf(p[0], p[1] + n, 1).slice(0, 7); }
  /** その月の仕入れ（読んだもの → スマホに覚えたもの） */
  function nyukaOf(ym) {
    if (st.nyuka[ym]) return st.nyuka[ym];
    var c = lsGet(LS.nyuka + ym);
    return c && c.rows || null;
  }
  function putNyuka(ym, rows) {
    st.nyuka[ym] = rows; st.nyukaAt[ym] = Date.now();
    lsPut(LS.nyuka + ym, { rows: rows, at: Date.now() });
    var oldest = shiftYm(today.slice(0, 7), -NYUKA_KEEP_MONTHS);
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && k.indexOf(LS.nyuka) === 0 && k.slice(LS.nyuka.length) < oldest) localStorage.removeItem(k);
      }
    } catch (e) { /* 消せないだけ */ }
  }
  /** Cloud Run（15分おきに読み直して覚えた値。ログイン不要）。読めなければ GAS に聞く */
  function fetchNyuka(r) {
    if (C.DEMO) return gas('nyuka.list', { from: r.from, to: r.to });   // デモ表示は今までどおり GAS の仮の数字
    var ac = window.AbortController ? new AbortController() : null;
    var timer = ac && setTimeout(function () { ac.abort(); }, 8000);   // Cloud Run が起きたてで GAS を待っているときは見切る
    return fetch(BOARD_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ac ? ac.signal : undefined,
                              body: JSON.stringify({ action: 'nyukaList', params: { from: r.from, to: r.to } }) })
      .then(function (x) { clearTimeout(timer); return x.json(); })
      .then(function (res) { if (!res || !res.ok) throw new Error((res && res.error) || '読めません'); return res; })
      .catch(function () { return gas('nyuka.list', { from: r.from, to: r.to }); });
  }
  function drawCalLoad() { $('calLoad').hidden = !st.calBusy[st.calYm]; drawReload(); }
  function loadMonth(ym, manual) {
    renderCal();
    if (st.calBusy[ym] || Date.now() - (st.nyukaAt[ym] || 0) < 60000) return;   // 1分以内に読んだ月は読み直さない
    st.calBusy[ym] = true; drawCalLoad(); renderDay(); $('calMsg').textContent = '';
    fetchNyuka(monthRange(ym)).then(function (res) {
      putNyuka(ym, res.rows || []);
      if (st.calYm === ym) $('calMsg').textContent = '';
      if (manual && st.tab === 'shiire') toast('最新にしました');
    }, function (err) {
      if (st.calYm === ym) $('calMsg').textContent = '読み込めません' + (nyukaOf(ym) ? '（前に読んだ予定を表示しています）' : err && err.network ? '' : '：' + (err && err.message || err));
    }).then(function () {
      st.calBusy[ym] = false;
      if (st.calYm === ym) renderCal();
    });
  }
  function rowsOfDay(ymd) {
    var rows = nyukaOf(ymd.slice(0, 7)) || [];
    return rows.filter(function (x) { return x.date === ymd && Number(x.count) > 0; });
  }
  function renderCal() {
    var r = monthRange(st.calYm);
    $('monTitle').textContent = r.y + '年' + r.m + '月';
    var first = new Date(r.y, r.m - 1, 1).getDay(), last = new Date(r.y, r.m, 0).getDate();
    var weeks = Math.ceil((first + last) / 7);
    var h = '<tr>' + WEEK.map(function (w) { return '<th>' + w + '</th>'; }).join('') + '</tr>';
    for (var w = 0; w < weeks; w++) {
      h += '<tr>';
      for (var k = 0; k < 7; k++) {
        var d = w * 7 + k - first + 1;
        if (d < 1 || d > last) { h += '<td></td>'; continue; }
        var ymd = ymdOf(r.y, r.m, d), rows = rowsOfDay(ymd);
        var col = k === 0 ? '#c03' : k === 6 ? '#14c' : '#333';
        h += '<td data-d="' + ymd + '" class="' + (ymd === today ? 'today' : '') + (ymd === st.calSel ? ' sel' : '') + '">' +
          '<div class="d" style="color:' + col + '">' + d + '</div>' +
          rows.slice(0, 3).map(function (x) {
            return '<div class="bar ' + binClass(x.bin) + '">' + esc((x.kind === '未培養' ? '未' : '完') + x.count) + '</div>';
          }).join('') + (rows.length > 3 ? '<div class="more">＋' + (rows.length - 3) + '</div>' : '') + '</td>';
      }
      h += '</tr>';
    }
    var t = $('cal'); t.innerHTML = h; t.classList.toggle('six', weeks > 5);
    drawCalLoad();
    renderDay();
  }
  function renderDay() {
    var el = $('dayList');
    if (!st.calSel || st.calSel.slice(0, 7) !== st.calYm) { el.hidden = true; return; }
    el.hidden = false;
    var p = parts(st.calSel), rows = rowsOfDay(st.calSel);
    el.innerHTML = '<b>' + p[1] + '/' + p[2] + '（' + WEEK[new Date(p[0], p[1] - 1, p[2]).getDay()] + '）</b>' +
      (rows.length ? rows.map(function (x) {
        return '<div class="row"><span>' + esc(x.bin) + '</span><span>' + esc(x.kind) + ' ' + num(x.count) + '</span></div>';
      }).join('') : '<div class="none">' + (nyukaOf(st.calYm) ? '便なし' : st.calBusy[st.calYm] ? '読み込み中…' : '読み込めません') + '</div>');
  }
  $('cal').onclick = function (e) { var td = e.target.closest('td[data-d]'); if (td) { st.calSel = td.dataset.d; renderCal(); } };
  $('prevMon').onclick = function () { st.calYm = shiftYm(st.calYm, -1); loadMonth(st.calYm); };
  $('nextMon').onclick = function () { st.calYm = shiftYm(st.calYm, 1); loadMonth(st.calYm); };

  // ---------------------------------------------------------------- 棚（見取り図）
  /** 最後に GAS から届いた棚 */
  function baseOf(site) { return st.tana[site] || lsGet(LS.tana + site); }
  /** 画面に出す棚＝届いた棚に、まだ送り終えていない操作を重ねたもの（直し6） */
  function tanaOf(site) {
    var d = baseOf(site);
    var ops = queue.filter(function (o) { return o.site === site; });
    if (!d || !ops.length) return d;
    var faces = d.faces || [];
    ops.forEach(function (o) { faces = applyOp(faces, o, d.today || today); });
    return Object.assign({}, d, { faces: faces });
  }
  /** 読み込み中（前に覚えた棚を出している間）は面を押せなくし、薄く出す */
  function tanaWait() { return !!st.tanaBusy[st.site]; }
  function drawTanaLoad() {
    var d = tanaOf(st.site);
    $('tanaLoad').hidden = !(st.tanaBusy[st.site] && d && d.rooms && d.rooms.length);
    $('pager').classList.toggle('wait', tanaWait());
    $('recBtn').disabled = tanaWait();
    drawReload();
  }
  /**
   * 開いたときにログインが切れていそうなら、始めるときにセッションを外してログインを先に走らせ（initWork の lazy）、
   * その間に前のトークンで tana.list を呼ぶ。通ればそれを使い、切れていれば（AUTH）ログインを待って呼び直す
   */
  var oldToken = null;
  function listTana(site) {
    var tok = oldToken; oldToken = null;
    if (!tok) return gas('tana.list', { site: site });
    return C.callApi({ action: 'tana.list', token: tok, site: site }).then(function (res) {
      if (res && res.ok) { lsPut(LS.okAt, Date.now()); return res; }
      if (res && res.code === 'AUTH') return gas('tana.list', { site: site });
      var e = new Error((res && res.error) || 'サーバがエラーを返しました。'); e.code = res && res.code; throw e;
    }, function () { return gas('tana.list', { site: site }); });
  }
  function loadTana(site, manual) {
    st.tanaBusy[site] = (st.tanaBusy[site] || 0) + 1; drawTanaLoad();
    var seq = st.wseq[site] || 0;
    listTana(site).then(function (res) {
      // 読んでいる間に送り終えた操作があれば、その応答の棚の方が新しい
      var b = baseOf(site), fresh = (st.wseq[site] || 0) === seq;
      setTana(site, fresh || !b ? res : Object.assign({}, res, { faces: b.faces }));
      if (fresh && res.baiyou) setBai(site, res.baiyou);   // 直し8：棚と一緒に培養舎の残りも届く
      $('tanaMsg').textContent = '';
      if (manual && st.site === site && st.tab === 'tana') toast('最新にしました');
    }, function (err) {
      if (st.site === site) $('tanaMsg').textContent = '読み込めません' + (err && err.network ? '' : '：' + (err && err.message || err));
    }).then(function () { st.tanaBusy[site]--; drawTanaLoad(); });
  }
  function setTana(site, res) {
    var d = { rooms: res.rooms || [], faces: res.faces || [], today: res.today || today };
    st.tana[site] = d;
    lsPut(LS.tana + site, d);
    if (st.site === site && st.tab === 'tana') renderTana();
  }
  function setFaces(site, faces) {
    var b = baseOf(site);
    if (b) setTana(site, Object.assign({}, b, { faces: faces }));
  }
  /** 部屋ごとの画面（森林公園は4棚ずつ） */
  function views(d) {
    var out = [];
    d.rooms.forEach(function (r) {
      for (var i = 0; i < r.shelves.length; i += r.page) out.push({ room: r, shelves: r.shelves.slice(i, i + r.page), sub: i / r.page, subs: Math.ceil(r.shelves.length / r.page) });
    });
    return out;
  }
  /** 面 → その面の記録（並べた日の順） */
  function faceMap(d, room) {
    var m = {};
    d.faces.forEach(function (x) { if (x.room === room) (m[x.face] = m[x.face] || []).push(x); });
    Object.keys(m).forEach(function (k) { m[k].sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }); });
    return m;
  }
  function isResv(recs) { return (recs || []).some(function (x) { return x.reserve; }); }
  function isSakae(recs) { return (recs || []).some(function (x) { return x.kinsho === SAKAE; }); }
  var SK = '<i class="sk">栄</i>';
  /** 直し9：並べた日＋菌床ごとにまとめる [{ date, sk, count }]。同じ日でも月夜野と栄は別（同じ日なら月夜野が先） */
  function groups(recs) {
    var o = [], at = {};
    (recs || []).forEach(function (x) {
      var sk = x.kinsho === SAKAE, k = x.date + (sk ? '|栄' : '');
      if (!(k in at)) { at[k] = o.length; o.push({ date: x.date, sk: sk, count: 0 }); }
      o[at[k]].count += Number(x.count) || 0;
    });
    return o.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.sk - b.sk; });
  }
  /** 栄の部分の斜線と枠（1つなら面全体、2つ以上なら斜めの2色のうち栄の側） */
  function kzHtml(g) {
    if (g.length < 2) return g.length && g[0].sk ? '<i class="kz"></i>' : '';
    return (g[0].sk ? '<i class="kz h1"></i>' : '') + (g[1] && g[1].sk ? '<i class="kz h2"></i>' : '');
  }
  function faceHtml(room, name, recs, h, base, pm) {
    var g = groups(recs), sel = pm[name] ? ' pend' : '', pd = pm[name] ? '<i class="pd">⟳</i>' : '';
    var attr = ' data-face="' + name + '" style="height:' + h + 'px;';
    if (!g.length) return '<div class="f empty' + sel + '"' + attr + '">' + pd + '<s>空</s></div>';
    if (isResv(recs)) {   // 袋出し予約（予約の面にはほかの記録を足せない）
      return '<div class="f resv' + sel + '"' + attr + '">' + pd + (isSakae(recs) ? SK : '') + '<b>' + parts(g[0].date)[2] + '<small>日</small></b><s>' + g.reduce(function (s, x) { return s + x.count; }, 0) + '個</s></div>';
    }

   * 取り消しを先に送り、残りを空にする
   */
  function emptyOps(site, room, name, targets, all) {
    var whole = targets.length === all.length, ops = [];
    var old = whole ? targets.filter(function (x) { return !fresh(x); }) : [];
    targets.forEach(function (x) {
      if (old.indexOf(x) < 0) ops.push(mkOp(site, room, 'tana.void', { id: x.id }, [name], { recs: [x] }));
    });
    if (old.length) ops.push(mkOp(site, room, 'tana.clear', { site: site, room: room, faces: [name] }, [name], { ids: old.map(function (x) { return x.id; }), recs: old }));
    return ops;
  }

  // ---------------------------------------------------------------- 下から出る画面
  // スマホの「戻る」で画面だけ閉じる：開いたら履歴を1つ足し、戻る（popstate）で閉じる。×・暗い所・送り終わりで閉じたら足した履歴を戻す
  var sheets = [], histOn = false, skipPop = 0;
  window.addEventListener('popstate', function () {
    if (skipPop) { skipPop--; return; }
    if (!histOn) return;
    histOn = false;
    sheets.slice().forEach(function (o) { o.close(true); });
  });
  function sheet(title, html) {
    var dim = document.createElement('div');
    dim.className = 'dim';
    dim.innerHTML = '<div class="sheet"><div class="ttl"><button type="button" class="x" data-el="x" aria-label="閉じる">×</button><span data-el="ttl">' + title + '</span></div>' + html + '</div>';
    document.body.appendChild(dim);
    var o = { el: dim, q: function (s) { return dim.querySelector(s); } };
    o.close = function (fromPop) {
      if (!dim.parentNode) return;
      dim.parentNode.removeChild(dim);
      sheets.splice(sheets.indexOf(o), 1); placeToast();
      // 続けて別の画面を開く（追加 → 記録）ときは履歴をそのまま使う
      if (fromPop !== true) setTimeout(function () { if (!sheets.length && histOn) { histOn = false; skipPop++; history.back(); } }, 0);
    };
    sheets.push(o); placeToast();
    if (!histOn) { try { history.pushState({ sgSheet: 1 }, ''); histOn = true; } catch (e) { /* 戻るで閉じられないだけ */ } }
    dim.addEventListener('click', function (e) { if (e.target === dim) o.close(); });
    o.q('[data-el="x"]').onclick = function () { o.close(); };
    return o;
  }
  function siteRoom(room) { return SITES[st.site] + ' ' + room.room + 'の部屋'; }
  /** 押したら待たずに閉じる：画面を閉じ、順番待ちに入れて棚を書き換え、面を光らせて知らせる（送るのは裏で） */
  function commit(sh, ops, faces, msg, undo) {
    sh.close(); enqueue(ops);
    flash(faces); toast(msg, undo);
  }

  /**
   * 埋まっている面を直す（直し4）。並べた日ごとに1行：並べた日・個数を直して「保存する」（tana.edit）、
   * 行ごとの「この日の分を空にする」と面ごとの「空にする」（直し6。24時間以内は tana.void・過ぎたら tana.clear を画面が選ぶ）。「追加」は今までどおり
   */
  function openFace(room, name, recs) {
    var d = tanaOf(st.site), site = st.site, base = (d && d.today) || today;
    var sh = sheet(esc(siteRoom(room)) + '　' + esc(name),
      '<div style="margin-top:4px">' + recs.map(function (x, i) {
        return '<div class="erow" data-i="' + i + '"><div class="eh"><span><i' + (x.kinsho === SAKAE ? ' class="ksw"' : '') + ' style="background:' + colorOf(x.date) + '"></i>並べた日' + (x.kinsho === SAKAE ? SK : '') + '</span><span class="who">' + esc(x.surname || '') + '</span></div>' +
          '<div class="ein"><span class="dpick"><button type="button" class="dbox" tabindex="-1" data-el="dl">' + md(x.date) + '</button>' +
          '<input type="date" data-k="date" aria-label="並べた日" value="' + esc(x.date) + '" min="' + addDays(base, -120) + '" max="' + base + '"></span>' +
          '<span><input type="text" inputmode="numeric" autocomplete="off" data-k="count" value="' + x.count + '">個</span></div>' +
          (recs.length > 1 ? '<button type="button" class="wbtn del sm" data-el="clr1">この日の分を空にする</button>' : '') + '</div>';
      }).join('') + '<div class="rec"><span>合計</span><b data-el="sum"></b></div></div>' +
      '<div class="err" data-el="err" style="margin-top:8px"></div>' +
      '<button type="button" class="btn" data-el="save" style="margin-top:8px">保存する</button>' +
      '<div class="two"><button type="button" class="wbtn del" data-el="clear">空にする</button><button type="button" class="wbtn" data-el="add">追加</button></div>');
    var rows = Array.prototype.slice.call(sh.el.querySelectorAll('.erow'));
    function val(i) {
      var r = rows[i];
      return { date: r.querySelector('[data-k="date"]').value, count: C.readNum(r.querySelector('[data-k="count"]').value) };
    }
    function changes() {
      var out = [], bad = '';
      recs.forEach(function (x, i) {
        var v = val(i);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v.date) || v.date > base || v.date < addDays(base, -120)) bad = '並べた日は今日から120日前までにしてください';
        else if (!(v.count >= 1 && v.count <= 200 && v.count === Math.floor(v.count))) bad = '個数は1〜200の整数で入れてください';
        else if (v.date !== x.date || v.count !== Number(x.count)) out.push({ id: x.id, date: v.date, count: v.count });
      });
      return { list: out, bad: bad };
    }
    function draw() {
      var c = changes();
      rows.forEach(function (r, i) { var v = val(i).date; r.querySelector('[data-el="dl"]').textContent = /^\d{4}-\d{2}-\d{2}$/.test(v) ? md(v) : '日付を選ぶ'; });
      sh.q('[data-el="sum"]').textContent = recs.reduce(function (s, x, i) { return s + (Number(val(i).count) || 0); }, 0) + '個';
      sh.q('[data-el="err"]').textContent = c.bad;
      sh.q('[data-el="save"]').disabled = !!c.bad || !c.list.length;
    }
    rows.forEach(function (r) {
      Array.prototype.forEach.call(r.querySelectorAll('input'), function (el) { el.addEventListener('input', draw); el.addEventListener('change', draw); });
      r.querySelector('[data-k="count"]').addEventListener('focus', function () { try { this.select(); } catch (er) { /* 無視 */ } });
    });
    sh.q('[data-el="save"]').onclick = function () {
      var c = changes(); if (c.bad || !c.list.length) return;
      // 1行ずつ送る（同じ値で送り直しても二重にならない）
      commit(sh, c.list.map(function (x) { return mkOp(site, room.room, 'tana.edit', { id: x.id, date: x.date, count: x.count }, [name]); }), [name], '保存しました');
    };
    // 空にするは確認を出さず、下に5秒「元に戻す」を出す
    function empty(targets, msg) {
      var ops = emptyOps(site, room.room, name, targets, recs);
      commit(sh, ops, [name], msg, undoer(ops, false));
    }
    rows.forEach(function (r, i) {
      var b = r.querySelector('[data-el="clr1"]');
      if (b) b.onclick = function () { empty([recs[i]], md(recs[i].date) + ' の ' + recs[i].count + '個を空にしました'); };
    });
    sh.q('[data-el="add"]').onclick = function () { sh.close(); openRecord(room, [name]); };
    sh.q('[data-el="clear"]').onclick = function () { empty(recs, name + ' を空にしました'); };
    draw();
  }

  /** 袋出し予約の面：袋出し済みにする（並べた日＝今日）か、予約をやめる */
  function openResv(room, name, recs) {
    var site = st.site;
    var total = recs.reduce(function (s, x) { return s + (Number(x.count) || 0); }, 0);
    var sh = sheet(esc(siteRoom(room)) + '　' + esc(name),
      '<div style="margin-top:4px">' + recs.map(function (x) {
        return '<div class="rec"><span><i' + (x.kinsho === SAKAE ? ' class="ksw"' : '') + ' style="background:#d9443f"></i>' + md(x.date) + ' に袋出し予約' + (x.kinsho === SAKAE ? SK : '') + '</span><span><b>' + x.count + '個</b> <span class="who">' + esc(x.surname || '') + '</span></span></div>';
      }).join('') + '</div>' +
      '<div class="err" data-el="err" style="margin-top:8px"></div>' +
      '<button type="button" class="btn" data-el="done" style="margin-top:8px">袋出し済みにする（並べた日＝今日）</button>' +
      '<button type="button" class="wbtn del" data-el="cancel" style="width:100%;margin-top:10px">予約をやめる</button>');
    function op(action) { return mkOp(site, room.room, action, { site: site, room: room.room, faces: [name] }, [name], { recs: recs }); }
    // 直し8：栄の予約は済みにしたときに培養舎から減らす。残りが足りなければ済みにしない
    var sakaeN = recs.reduce(function (s, x) { return s + (x.kinsho === SAKAE ? Number(x.count) || 0 : 0); }, 0);
    sh.q('[data-el="done"]').onclick = function () {
      var b = baiOf(site);
      if (sakaeN && b && sakaeN > b.total) { sh.q('[data-el="err"]').textContent = '培養舎の残りが足りません（残り' + num(b.total) + '個）'; return; }
      var o = op('tana.done'); if (sakaeN) o.sakaeN = sakaeN;
      commit(sh, [o], [name], '袋出し済みにしました');
    };
    // 予約をやめるは確認を出さず、下に5秒「元に戻す」（同じ日で予約し直す）
    sh.q('[data-el="cancel"]').onclick = function () {
      var o = op('tana.cancel');
      commit(sh, [o], [name], name + '（' + total + '個）の予約をやめました', undoer([o], true));
    };
  }

  /**
   * 袋出しを記録（済み／予約・並べた日・面・合計の個数）。
   * 面はタップで選ぶ／もう一度タップで外す（長押し・なぞるは直し5でなくした）。満杯の面・予約の面は選べない
   * （満杯の面は「追加」から開いたときだけ済みで選べる）。空きが残っている面（置いている個数＜1面の個数）は済みなら選べて、
   * 個数は残りの数（直し3。斜めの2色になる）。予約で選べるのは空の面だけ。
   * 合計は選んだ面の空きの合計から始まり、直すと選んだ順に空きの数ずつ埋め、端数は最後の面に入れる
   */
  function openRecord(room, preset) {
    var d = tanaOf(st.site), site = st.site;
    var base = (d && d.today) || today, fm = faceMap(d, room.room);
    var rec = { opId: newId(), resv: false, date: base, picked: false, per: room.per, order: [], total: 0, kinsho: '' };   // kinsho ''＝月夜野（初期値）／'栄'
    var used = function (f) { return (fm[f] || []).reduce(function (t, x) { return t + (Number(x.count) || 0); }, 0); };
    var full = function (f) { return !!(fm[f] && fm[f].length); };
    var extra = {};   // 追加から開いた面
    (preset || []).forEach(function (f) { if (full(f) && !isResv(fm[f])) extra[f] = true; });
    function canPick(f) { return !isResv(fm[f]) && (!full(f) || !rec.resv && (extra[f] || used(f) < rec.per)); }
    function capOf(f) { return full(f) ? Math.max(1, rec.per - used(f)) : rec.per; }
    function firstDay() { return rec.resv ? addDays(base, 1) : base; }
    (preset || []).forEach(function (f) { if (canPick(f) && rec.order.indexOf(f) < 0) rec.order.push(f); });
    var sh = sheet('',
      // 1面の個数を選ぶ部屋（寄居の真ん中）だけ、上の方に「1面 42｜68」
      (room.choices.length > 1 ? '<div class="perrow"><span>1面</span><div class="pills" data-el="per"></div></div>' : '') +
      '<div class="pills" data-el="mode" style="margin-top:12px"><button type="button" data-m="done">袋出し済み</button><button type="button" data-m="resv">袋出し予約</button></div>' +
      '<h3>① 菌床</h3><div class="pills" data-el="kin"><button type="button" data-k="">月夜野（完熟）</button><button type="button" data-k="栄">栄（自社培養）</button></div>' +
      '<div class="kleft" data-el="kleft"></div>' +
      '<h3 data-el="dh"></h3><div class="pills" data-el="dates"><button type="button" data-m="first"></button>' +
      '<span class="dpick"><button type="button" data-m="pick" tabindex="-1"></button><input type="date" data-el="pick" aria-label="日付を選ぶ"></span></div>' +
      '<h3>③ 置いた面（タップで選ぶ・もう一度で外す）</h3><div class="mini" data-el="mini"></div>' +
      '<div class="tot"><span data-el="n"></span><span>合計<input type="text" inputmode="numeric" autocomplete="off" data-el="total">個</span></div>' +
      '<div class="err" data-el="err"></div><button type="button" class="btn" data-el="go">記録する</button>');
    var pick = sh.q('[data-el="pick"]'), mini = sh.q('[data-el="mini"]'), totIn = sh.q('[data-el="total"]');
    function drawMode() {
      sh.q('[data-el="ttl"]').textContent = (rec.resv ? '袋出しを予約' : '袋出しを記録') + '　' + room.room + 'の部屋';   // 拠点は右上に出ている（見本どおり）
      Array.prototype.forEach.call(sh.q('[data-el="mode"]').children, function (b) {
        var on = (b.dataset.m === 'resv') === rec.resv;
        b.classList.toggle('on', on); b.classList.toggle('rv', on && rec.resv);
      });
      sh.q('[data-el="dh"]').textContent = rec.resv ? '② 袋出しする日' : '② 並べた日';
      drawKin();
    }
    /** ① 菌床：栄なら培養舎の残りを添える（済みは一番古い仕入れ分から減らす・予約は済みにしたときに減らす） */
    function drawKin() {
      Array.prototype.forEach.call(sh.q('[data-el="kin"]').children, function (b) { b.classList.toggle('on', b.dataset.k === rec.kinsho); });
      var b = baiOf(site), t = '';
      if (rec.kinsho === SAKAE) {
        t = !b ? '培養舎の残りを読み込めていません（送ったときに確かめます）'
          : '培養舎の残り ' + num(b.total) + '個' + (rec.resv ? '（済みにしたときに減らします）' : b.lots.length ? '（一番古い ' + md(b.lots[0].date) + ' 仕入れ分から減らします）' : '');
      }
      sh.q('[data-el="kleft"]').textContent = t;
    }
    sh.q('[data-el="kin"]').onclick = function (e) {
      var b = e.target.closest('button'); if (!b || b.dataset.k === rec.kinsho) return;
      rec.kinsho = b.dataset.k; drawKin(); drawTot();
    };
    // 「日付を選ぶ」は上に重ねた透明な input に指が直接触れて開く（直し7）。iPhone の Safari は JS の showPicker()／click() では
    // 開かないため。描き直しは中身だけ変える（開いているカレンダーの下の input を作り直さない）
    function drawDates() {
      var f = firstDay(), first = sh.q('[data-m="first"]'), lb = sh.q('[data-m="pick"]');
      first.className = rec.picked ? '' : 'on';
      first.textContent = (rec.resv ? '明日 ' : '今日 ') + md(f);
      lb.className = rec.picked ? 'on' : '';
      lb.textContent = rec.picked ? md(rec.date) : '日付を選ぶ';
      pick.min = rec.resv ? base : addDays(base, -120);
      pick.max = rec.resv ? addDays(base, 60) : base;
      pick.value = rec.date;
    }
    sh.q('[data-el="mode"]').onclick = function (e) {
      var b = e.target.closest('button'); if (!b || (b.dataset.m === 'resv') === rec.resv) return;
      rec.resv = b.dataset.m === 'resv';
      rec.date = firstDay(); rec.picked = false;
      rec.order = rec.order.filter(canPick);   // 予約にすると「追加」の埋まっている面は外れる
      drawMode(); drawDates(); drawMini(); resetTotal();
    };
    sh.q('[data-m="first"]').onclick = function () { rec.date = firstDay(); rec.picked = false; drawDates(); drawTot(); };
    // iPhone のカレンダーは min／max の外も選べてしまうので、外なら理由を出して元の日に戻す。「消去」で空になったら元の日のまま
    pick.onchange = function () {
      var v = pick.value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { drawDates(); return; }
      if (v < pick.min || v > pick.max) {
        drawDates();
        sh.q('[data-el="err"]').textContent = rec.resv ? '袋出しする日は今日から60日先までにしてください' : '並べた日は今日から120日前までにしてください';
        return;
      }
      rec.date = v; rec.picked = v !== firstDay();
      drawDates(); drawTot();
    };
    function drawPer() {
      var el = sh.q('[data-el="per"]'); if (!el) return;
      el.innerHTML = room.choices.map(function (n) { return '<button type="button" data-n="' + n + '" class="' + (n === rec.per ? 'on' : '') + '">' + n + '</button>'; }).join('');
    }
    if (sh.q('[data-el="per"]')) sh.q('[data-el="per"]').onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      rec.per = Number(b.dataset.n);
      rec.order = rec.order.filter(canPick);   // 1面の個数を減らすと満杯になる面は外れる
      drawPer(); resetTotal();
    };
    /** 面ごとの個数：選んだ順に1面の個数ずつ埋め、端数（足りない分・余る分）は最後の面 */
    function split() {
      var left = rec.total, out = {};
      rec.order.forEach(function (f, i) {
        var n = i === rec.order.length - 1 ? left : Math.min(capOf(f), Math.max(0, left));
        out[f] = n; left -= n;
      });
      return out;
    }
    function drawMini() {   // 枠は1度だけ作り、選び直しでは色と数字だけ変える（なぞっている間に指の下の面を消さない）
      if (!mini.firstChild) {
        mini.innerHTML = room.shelves.map(function (s) {
          var h = '<div class="sh"><div class="t">' + s + '</div>';
          for (var k = room.depth; k >= 1; k--) {
            h += '<div class="p">' + ['左', '右'].map(function (side) { return '<button type="button" class="c" data-f="' + s + '-' + side + k + '"></button>'; }).join('') + '</div>';
          }
          return h + '</div>';
        }).join('');
      }
      var cnt = split();
      Array.prototype.forEach.call(mini.querySelectorAll('button[data-f]'), function (b) {
        var f = b.dataset.f, on = rec.order.indexOf(f) >= 0;
        var part = !on && full(f) && canPick(f) && used(f) < rec.per;   // 空きが残っている面（斜めの灰。数字は空きの数）
        b.className = 'c ' + (on ? 'sel' : isResv(fm[f]) ? 'r' : !canPick(f) ? 'x' : part ? 'h' : '');
        var t = on ? (cnt[f] !== capOf(f) ? String(cnt[f]) : '') : part ? String(capOf(f)) : '';   // 選んだ面は空きと違う数（端数）だけ出す
        b.innerHTML = (on ? '' : kzHtml(groups(fm[f]))) + (t ? '<span>' + t + '</span>' : '');   // 直し9：栄の部分は棚と同じ斜線と枠
      });
    }
    function resetTotal() {
      rec.total = rec.order.reduce(function (s, f) { return s + capOf(f); }, 0);
      totIn.value = rec.order.length ? String(rec.total) : '';
      drawMini(); drawTot();
    }
    function drawTot() {
      var n = rec.order.length, cnt = split(), bad = '';
      sh.q('[data-el="n"]').textContent = n + '面';
      if (n) {
        if (!(rec.total >= 1) || rec.total !== Math.floor(rec.total)) bad = '合計は個数（整数）で入れてください';
        else if (rec.order.some(function (f) { return cnt[f] < 1; })) bad = '合計が面の数より少なすぎます（' + rec.order.filter(function (f) { return cnt[f] < 1; }).length + '面が0個になります）';
        else if (rec.order.some(function (f) { return cnt[f] > 200; })) bad = '1面に200個より多くは入れられません';
        else if (rec.kinsho === SAKAE && !rec.resv) {   // 直し8：栄の済みは培養舎の残りまで（足りなければ記録しない）
          var b = baiOf(site);
          if (b && rec.total > b.total) bad = '培養舎の残りが足りません（残り' + num(b.total) + '個）';
        }
      }
      sh.q('[data-el="err"]').textContent = bad;
      sh.q('[data-el="go"]').disabled = !n || !!bad;
    }
    totIn.addEventListener('input', function () {
      var v = C.readNum(totIn.value);
      rec.total = v === null ? NaN : v;
      drawMini(); drawTot();
    });
    totIn.addEventListener('focus', function () { try { totIn.select(); } catch (er) { /* 無視 */ } });
    // 面を選ぶ：タップ＝選ぶ／もう一度タップ＝外す（枠は描き直さないので click でよい）
    mini.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-f]'); if (!b) return;
      var f = b.dataset.f, i = rec.order.indexOf(f);
      if (i >= 0) rec.order.splice(i, 1);
      else if (canPick(f)) rec.order.push(f);
      else return;
      resetTotal();
    });
    mini.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    sh.q('[data-el="go"]').onclick = function () {
      if (!rec.order.length || this.disabled) return;
      var cnt = split(), resv = rec.resv, faces = rec.order.slice();
      // 同じ opId で送り直せば二重にならない
      var q = { opId: rec.opId, site: site, room: room.room, date: rec.date,
                faces: faces.map(function (f) { return { face: f, count: cnt[f] }; }) };
      if (resv) q.reserve = true;
      if (rec.kinsho) q.kinsho = rec.kinsho;
      commit(sh, [mkOp(site, room.room, 'tana.add', q, faces)], faces, resv ? '予約しました' : '記録しました');
    };
    drawMode(); drawDates(); drawPer(); resetTotal();
  }
  $('recBtn').onclick = function () { var v = curView(); if (v) openRecord(v.room, []); };

  // ---------------------------------------------------------------- 培養舎（直し8）
  // 拠点ごとの仕入れ分（GAS Baiyou.gs。判断ボードの培養舎と同じ数）。届いた数に、順番待ちの操作（足す・直す・栄の袋出し）を重ねて出す
  function baiBase(site) { return st.bai[site] || lsGet(LS.bai + site); }
  function setBai(site, b) {
    if (!b || !Array.isArray(b.lots)) return;
    var old = baiBase(site) || {};
    var d = { lots: b.lots, total: Number(b.total) || 0, upcoming: b.upcoming || old.upcoming || [] };
    st.bai[site] = d; lsPut(LS.bai + site, d);
    if (st.site === site && st.tab === 'baiyou') renderBaiyou();
  }
  /** 画面に出す培養舎（古い順・0は出さない）。読めていなければ null */
  function baiOf(site) {
    var b = baiBase(site); if (!b) return null;
    var lots = b.lots.map(function (l) { return { date: l.date, count: Number(l.count) || 0 }; });
    var lot = function (d) {
      var l = lots.filter(function (x) { return x.date === d; })[0];
      if (!l) { l = { date: d, count: 0 }; lots.push(l); lots.sort(function (a, c) { return a.date < c.date ? -1 : 1; }); }
      return l;
    };
    var take = function (n) { lots.forEach(function (l) { var k = Math.min(l.count, n); l.count -= k; n -= k; }); };
    queue.forEach(function (o) {
      if (o.site !== site) return;
      if (o.action === 'baiyou.add') lot(o.p.lot).count += o.p.count;
      else if (o.action === 'baiyou.adjust') lot(o.p.lot).count = o.p.count;
      else if (o.action === 'tana.add' && o.p.kinsho === SAKAE && !o.p.reserve && !o.p.keep) take(o.p.faces.reduce(function (s, f) { return s + f.count; }, 0));
      else if (o.action === 'tana.done' && o.sakaeN) take(o.sakaeN);
    });
    lots = lots.filter(function (l) { return l.count > 0; });
    return { lots: lots, total: lots.reduce(function (s, l) { return s + l.count; }, 0), upcoming: b.upcoming || [] };
  }
  function drawBaiLoad() { $('bLoad').hidden = !(st.baiBusy[st.site] && baiBase(st.site)); drawReload(); }
  function loadBaiyou(site, manual) {
    st.baiBusy[site] = (st.baiBusy[site] || 0) + 1; drawBaiLoad();
    var seq = st.wseq[site] || 0;
    gas('baiyou.list', { site: site }).then(function (res) {
      if ((st.wseq[site] || 0) === seq || !baiBase(site)) setBai(site, res);   // 読んでいる間に送り終えた操作があれば、その応答の方が新しい
      else setBai(site, Object.assign({}, baiBase(site), { upcoming: res.upcoming }));
      if (st.site === site) $('bMsg').textContent = '';
      if (manual && st.site === site && st.tab === 'baiyou') toast('最新にしました');
    }, function (err) {
      if (st.site === site) $('bMsg').textContent = '読み込めません' + (err && err.network ? '' : '：' + (err && err.message || err));
    }).then(function () { st.baiBusy[site]--; drawBaiLoad(); if (st.site === site && st.tab === 'baiyou') renderBaiyou(); });
  }
  function baiPend(site) {
    var m = {};
    queue.forEach(function (o) { if (o.site === site && /^baiyou\./.test(o.action)) m[o.p.lot] = 1; });
    return m;
  }
  function renderBaiyou() {
    var b = baiOf(st.site), pm = baiPend(st.site);
    $('bTotal').textContent = b ? num(b.total) : '–';
    $('bList').innerHTML = !b ? '<div class="bnone">' + (st.baiBusy[st.site] ? '読み込み中…' : '読み込めません') + '</div>'
      : !b.lots.length ? '<div class="bnone">培養舎の菌床はありません</div>'
      : b.lots.map(function (l, i) {
        return '<button type="button" class="lot' + (i === 0 ? ' next' : '') + '" data-lot="' + l.date + '"><span class="ld">' + md(l.date) + ' 仕入れ' +
          (pm[l.date] ? '<i class="pd">⟳</i>' : '') + (i === 0 ? '<small>次に出す分</small>' : '') + '</span><span class="lc"><b>' + num(l.count) + '</b>個</span></button>';
      }).join('');
    var up = b ? b.upcoming || [] : [];
    $('bUpc').textContent = up.length ? 'これから着く未培養：' + up.map(function (x) { return md(x.date) + ' ' + num(x.count) + '個'; }).join('、') + '（着いた日に自動で足します）' : '';
    drawBaiLoad();
  }
  $('bList').onclick = function (e) {
    var t = e.target.closest('button[data-lot]'); if (!t || sheets.length) return;
    var l = (baiOf(st.site) || { lots: [] }).lots.filter(function (x) { return x.date === t.dataset.lot; })[0];
    if (l) openLot(l);
  };
  $('bAdd').onclick = function () { if (!sheets.length) openAddLot(); };
  function readCount(el) { var v = C.readNum(el.value); return v !== null && v >= 0 && v <= 20000 && v === Math.floor(v) ? v : null; }
  /** 仕入れ分の個数を直す（誰でも。baiyou.adjust＝その個数にする） */
  function openLot(l) {
    var site = st.site;
    var sh = sheet(esc(md(l.date)) + ' 仕入れ（' + esc(SITES[site]) + '）',
      '<h3>個数を直す</h3><div class="cnt"><input type="text" inputmode="numeric" autocomplete="off" data-el="n" value="' + l.count + '">個</div>' +
      '<div class="err" data-el="err" style="margin-top:8px"></div><button type="button" class="btn" data-el="save" style="margin-top:8px">保存する</button>');
    var inp = sh.q('[data-el="n"]');
    function draw() {
      var n = readCount(inp);
      sh.q('[data-el="err"]').textContent = n === null ? '個数は0〜20000の整数で入れてください' : '';
      sh.q('[data-el="save"]').disabled = n === null || n === l.count;
    }
    inp.addEventListener('input', draw);
    inp.addEventListener('focus', function () { try { inp.select(); } catch (er) { /* 無視 */ } });
    sh.q('[data-el="save"]').onclick = function () {
      var n = readCount(inp); if (n === null || n === l.count) return;
      commit(sh, [mkOp(site, '', 'baiyou.adjust', { site: site, lot: l.date, count: n }, [], { label: md(l.date) + ' 仕入れ' })], [],
             md(l.date) + ' 仕入れを ' + num(n) + '個に直しました');
    };
    draw();
  }
  /** 仕入れを足す（仕入れた日・個数。baiyou.add） */
  function openAddLot() {
    var site = st.site, base = today, add = { date: base, picked: false, opId: newId() };
    var sh = sheet('仕入れを足す（' + esc(SITES[site]) + '）',
      '<h3>仕入れた日</h3><div class="pills"><button type="button" data-m="first">今日 ' + md(base) + '</button>' +
      '<span class="dpick"><button type="button" data-m="pick" tabindex="-1">日付を選ぶ</button><input type="date" data-el="pick" aria-label="仕入れた日" min="' + addDays(base, -400) + '" max="' + base + '" value="' + base + '"></span></div>' +
      '<h3>個数</h3><div class="cnt"><input type="text" inputmode="numeric" autocomplete="off" data-el="n" placeholder="0">個</div>' +
      '<div class="err" data-el="err" style="margin-top:8px"></div><button type="button" class="btn" data-el="go" style="margin-top:8px">足す</button>');
    var pick = sh.q('[data-el="pick"]'), inp = sh.q('[data-el="n"]');
    function draw(msg) {
      sh.q('[data-m="first"]').className = add.picked ? '' : 'on';
      sh.q('[data-m="pick"]').className = add.picked ? 'on' : '';
      sh.q('[data-m="pick"]').textContent = add.picked ? md(add.date) : '日付を選ぶ';
      pick.value = add.date;
      var n = readCount(inp);
      sh.q('[data-el="err"]').textContent = msg || (inp.value !== '' && !(n >= 1) ? '個数は1〜20000の整数で入れてください' : '');
      sh.q('[data-el="go"]').disabled = !(n >= 1);
    }
    sh.q('[data-m="first"]').onclick = function () { add.date = base; add.picked = false; draw(); };
    pick.onchange = function () {   // iPhone のカレンダーは min／max の外も選べるので、外なら理由を出して元の日のまま
      var v = pick.value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) { draw(); return; }
      if (v < pick.min || v > pick.max) { draw('仕入れた日は今日から400日前までにしてください'); return; }
      add.date = v; add.picked = v !== base; draw();
    };
    inp.addEventListener('input', function () { draw(); });
    sh.q('[data-el="go"]').onclick = function () {
      var n = readCount(inp); if (!(n >= 1)) return;
      commit(sh, [mkOp(site, '', 'baiyou.add', { opId: add.opId, site: site, lot: add.date, count: n }, [], { label: md(add.date) + ' 仕入れ' })], [],
             md(add.date) + ' 仕入れ ' + num(n) + '個を足しました');
    };
    draw();
  }

  // ---------------------------------------------------------------- 始める
  drawSites();
  var sess = lsGet(L.KEYS.work);
  if (!C.DEMO && L.person() && sess && sess.token && !(Number(lsGet(LS.okAt)) > Date.now() - STALE_MS)) {
    oldToken = sess.token;
    lsPut(L.KEYS.work, null);   // initWork（lazy）がすぐログインを始める
  }
  var ready = L.initWork({ lazy: true });   // セッションの置き場の設定はここで済む（デモの GAS もこの後に呼ぶ）
  // 仕入れはログインが要らないので、ログインを待たずに読み始める（棚で開いたときも先に読んでおく）
  loadMonth(st.calYm);
  // 順番待ちの続き（前に閉じたときに送り終えていなかった操作）はログインを待ってから送る
  ready.then(function () { setTab(st.tab); authOk = true; pump(); }, function () { setTab(st.tab); authOk = true; pump(); });
})();
</script>
<script>
// 新しい版が出ていたら読み直す（直し3）。ホーム画面のアプリは開き直しても前の画面がそのまま続くことがあり、
// Pages の HTML は10分キャッシュされるため。開いたとき・アプリに戻ったときに、この HTML をキャッシュなしで読んで sg-build を比べる。
// 記録・予約の画面を開いている間や送り終えていない操作があるときは読み直さない（次に戻ったときにまた見る）。電波が無ければ今の画面のまま
(function () {
  var BUILD = document.querySelector('meta[name="sg-build"]').content, KEY = 'sg.build.reloaded.' + location.pathname, last = 0;
  function busy() {
    var C = window.TougouCommon;
    return !!(document.querySelector('.dim') || !document.getElementById('toastUndo').hidden && !document.getElementById('toast').hidden || (localStorage.getItem('sg.fukuro.q') || '[]') !== '[]');
  }
  function check() {
    if (!window.fetch || Date.now() - last < 30000) return;
    last = Date.now();
    fetch(location.pathname, { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
      var m = /<meta name="sg-build" content="([^"]+)"/.exec(t);
      if (!m || m[1] === BUILD || busy()) return;
      try { if (sessionStorage.getItem(KEY) === m[1]) return; sessionStorage.setItem(KEY, m[1]); } catch (e) { return; }   // 読み直しても古いままなら繰り返さない
      var urls = [location.pathname].concat(Array.prototype.map.call(document.scripts, function (s) { return s.src; }).filter(function (u) { return u && u.indexOf(location.origin + '/') === 0; }));
      Promise.all(urls.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); })).then(function () { location.reload(); });
    }).catch(function () { /* 電波が無いときは今の画面のまま */ });
  }
  check();
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
})();
</script>
