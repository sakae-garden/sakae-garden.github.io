<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1c1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/tougou/icons/apple-touch-icon.png">
<title>生産入力 | 栄ガーデン</title>
<link rel="stylesheet" href="styles/common.css">
<!--
  生産入力（袋出し・浸水・収穫）。段階1-2 の GAS 画面（ui/Page_today.html）を Pages へ移したもの（指示 20260925-093100）。
  フォームの中身は js/seisan_form.js（今日の画面 kyou.html と共用。指示 20260925-096200）。この画面は日付を選べる。
  - 保存は「日付×拠点×種別」で1行 upsert（production.upsertMany）。入れる値は**その日の合計**（上書き。足し算ではない）
  - 空欄の欄は送らない（前の値のまま）。取り消しは 0
  - 見た目・操作は配達日報に合わせる（styles/common.css・js/common.js）
  統合アプリ完成（next/。設計 4章）での変更
  - ログインは js/login.js（管理）。戻り先は管理メニュー（kanri.html）
  - 生産・袋出しの指示の保存が成功したら、裏で yosoku.refresh を呼ぶ（js/kanri.js hookSaves。失敗は無視）
  - 下書きのキーは sg. で始める（旧画面 /tougou/ の下書きと混ぜない）
-->
<style>
/* この画面だけの部品（色・枠・角丸は common.css の値を使う） */
.shinsui-sub{font-size:11px;color:var(--sub);margin-top:2px}
.frow-lbl .srv{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:1px}
.frow.chg{background:#fffdf5}
.frow.chg .frow-lbl{font-weight:700}
/* 袋出しの指示（代表が入れる。指示と実績の差を出すだけ。指示 092000） */
.plan-line{background:#eef6ff;border:1px solid #bcd7f5;border-radius:var(--r);padding:8px 12px;margin-bottom:8px;font-size:14px;font-weight:700}
.plan-edit{margin-top:6px;font-weight:400;display:flex;align-items:center;gap:6px}
.plan-edit input{width:90px}
/* 日ごとの入力／袋出しの指示（月）の切り替え（代表のみ。指示 153500） */
.mode-sw{display:flex;gap:6px;margin-bottom:10px}
.mode-sw button{flex:1;min-height:44px;border:1px solid var(--border);border-radius:var(--r);background:#fff;font-size:14px;font-weight:700;color:var(--sub)}
.mode-sw button.on{background:#1c1c1e;color:#fff;border-color:#1c1c1e}
.pm-tools{padding:10px 12px}
.pm-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px;font-size:14px}
.pm-row input{width:70px}
.pm-target{display:inline-flex;gap:4px}
.pm-target .rtab{min-height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r);background:#fff;color:#1c1c1e}
.pm-target .rtab.active{background:#1c1c1e;color:#fff}
.pm-note{font-size:12px;color:var(--sub)}
.pm-tbl td,.pm-tbl th{text-align:center}
.pm-tbl .pm-day{text-align:left;white-space:nowrap;font-weight:700}
.pm-wd{font-size:11px;margin-left:3px;color:var(--sub);font-weight:400}
.pm-tbl tr.sat .pm-wd{color:#2563eb}
.pm-tbl tr.sun .pm-wd{color:#dc2626}
.pm-tbl tr.past td{background:#f6f6f6}
.pm-tbl tr.today td{background:#eef6ff}
.pm-cell input{width:72px;text-align:right}
.pm-cell.chg input{background:#fff7d6;border-color:#e0b100;font-weight:700}
.pm-act,.pm-std{font-size:11px;color:var(--sub);font-weight:400}
.pm-hist{margin:12px 0 20px;font-size:13px}
.pm-hist summary{cursor:pointer;color:var(--sub);padding:6px 0}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <h1>🌱 生産入力</h1>
    <a class="back-btn" href="kanri.html">← 管理</a>
  </div>
  <div class="hdr-date" id="hDate"></div>
  <!-- 拠点は日報の経路タブと同じ形でヘッダーに置く -->
  <div class="hdr-tabs" id="siteTabs"></div>
</div>

<div class="screen" id="app">
  <div class="mode-sw" id="modeSw" hidden><button type="button" data-mode="day" class="on">日ごとの入力</button><button type="button" data-mode="month">袋出しの指示（月）</button></div>
  <div id="msg"></div>
  <div id="form"></div>
  <div id="planMonth" hidden></div>
</div>

<footer class="footer"><a href="kanri.html">📋 管理メニューに戻る</a></footer>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
<script src="js/seisan_form.js"></script>
<script src="js/plan_month.js"></script>
<script src="js/kanri.js"></script>
<script>
(function () {
  'use strict';
  var C = window.TougouCommon, K = window.SgKanri;
  var $ = function (id) { return document.getElementById(id); };
  var msg = function (text, kind) {
    $('msg').innerHTML = text ? '<div class="notice ' + (kind || 'info') + '">' + C.esc(text).replace(/\n/g, '<br>') + '</div>' : '';
  };

  // 生産・袋出しの指示の保存が成功したら、裏で予測を計算し直す（失敗は無視。画面は止めない）
  K.hookSaves(C);

  $('hDate').textContent = C.jpDate(C.now());

  K.boot(function (session) {
    $('hDate').textContent = C.jpDate(C.now()) + '　' + (session && session.name || '');
    var rep = session && session.role === '代表';

    var form = window.TougouSeisanForm.mount({
      host: $('form'),
      siteTabs: $('siteTabs'),
      msg: msg,
      pickDate: true,
      planEdit: rep,   // 袋出しの指示を入れる欄と、指示と実績の差（代表のみ。サーバも代表だけ受ける）
      draftKey: 'sg.seisan.draft.v1',
      bannerHost: $('app')
    });

    // 袋出しの指示を月単位で入れる（代表のみ。指示 153500）。?mode=month で開いたときは月の表から
    if (!rep) return;
    var month = null;
    $('modeSw').hidden = false;
    function setMode(m) {
      var isMonth = m === 'month';
      Array.prototype.forEach.call($('modeSw').children, function (b) { b.classList.toggle('on', b.dataset.mode === m); });
      $('form').hidden = isMonth;
      $('siteTabs').hidden = isMonth;
      $('planMonth').hidden = !isMonth;
      msg('');
      if (isMonth && !month) month = window.TougouPlanMonth.mount({ host: $('planMonth'), msg: msg });
      if (!isMonth && month && form.reload) form.reload();   // 月の表で直した指示を日ごとの欄にも出す
    }
    Array.prototype.forEach.call($('modeSw').children, function (b) {
      b.onclick = function () {
        if (b.classList.contains('on')) return;
        setMode(b.dataset.mode);   // 月の表の保存していない変更は残る（戻れば続きから。閉じるときは離脱の警告）
        if (b.dataset.mode === 'day' && month && month.isDirty()) msg('月の表に保存していない変更があります（「袋出しの指示（月）」に戻ると続きから保存できます）。', 'warn');
      };
    });
    if (/[?&]mode=month(?:&|$)/.test(location.search)) setMode('month');
  });
})();
</script>
</body>
</html>
